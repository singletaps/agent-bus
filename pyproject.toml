[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bus"
version = "0.1.0"
description = "Durable local Agent Bus runtime for coordinating persistent Codex workers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
agent-bus = "agent_bus.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

